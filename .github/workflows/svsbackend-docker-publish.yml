name: SVS Backend CI and Docker Hub Publish

on:
  push:
    branches:
      - dipak

permissions:
  contents: read

concurrency:
  group: svsbackend-docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-smoke-publish:
    name: Test, build, smoke-test, and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svsbackend
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel tests
        run: php artisan test

      - name: Build Docker image
        id: image
        env:
          LOCAL_IMAGE: svschool-backend-ci:${{ github.sha }}
        run: docker build --file Dockerfile --tag "$LOCAL_IMAGE" .

      - name: Smoke-test image health endpoint
        env:
          LOCAL_IMAGE: svschool-backend-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          container_name="svschool-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container_name" 2>/dev/null || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:18080:8000 \
            --env APP_ENV=testing \
            --env APP_DEBUG=false \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=:memory: \
            --env CACHE_STORE=array \
            --env SESSION_DRIVER=array \
            --env QUEUE_CONNECTION=sync \
            --env RUN_MIGRATIONS=false \
            "$LOCAL_IMAGE"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/up; then
              printf '\nImage health endpoint is ready.\n'
              exit 0
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' "$container_name")" != "true" ]; then
              echo "Container stopped before becoming healthy." >&2
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for the container health endpoint." >&2
          exit 1

      - name: Validate Docker Hub configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/dipak'
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "Set the repository Actions variable DOCKERHUB_NAMESPACE to the Docker Hub account or organization that owns the image." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/dipak'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Add the DOCKERHUB_USERNAME Actions secret}"
          : "${DOCKERHUB_TOKEN:?Add the DOCKERHUB_TOKEN Actions secret}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push immutable commit tag, then latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/dipak'
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          LOCAL_IMAGE: svschool-backend-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          image="docker.io/${DOCKERHUB_NAMESPACE}/svschool-app"
          docker tag "$LOCAL_IMAGE" "$image:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$image:latest"
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"

      - name: Log out from Docker Hub
        if: always()
        run: docker logout || true
  deploy:
    name: Deploy to Server via SSH
    needs: test-build-smoke-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dipak'

    steps:
      - name: Configure SSH Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: SSH to Server and Execute Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /var/www/html/svschools

            # Export target commit SHA tag
            export APP_TAG=${{ github.sha }}

            # 1. Pull the published Docker Hub image
            docker compose pull app

            # 2. Start DB and Redis containers so MySQL is reachable
            docker compose up -d db redis

            # 3. Run database migrations (without --no-deps)
            docker compose run --rm app php artisan migrate --force

            # 4. Start/Recreate the app container
            docker compose up -d app

            # 5. Clear and rebuild production Laravel caches
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan view:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan view:cache

            # 6. Execute endpoint health check
            curl --fail --silent --show-error http://localhost:9000/up || exit 1