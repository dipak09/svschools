<VirtualHost *:8000>
	ServerName localhost

	# Laravel's front controller lives in public/
	DocumentRoot /var/www/html/public

	<Directory /var/www/html/public>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Never serve the application internals, even by accident
	<DirectoryMatch "^/var/www/html/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)">
		Require all denied
	</DirectoryMatch>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
